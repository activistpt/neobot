name: NEOBOT 24/7

# Hospedagem gratuita 24/7 no GitHub Actions:
# - O bot corre como job de longa duração (timeout máx. de 6h)
# - Antes do limite, o próprio job pede a execução seguinte (handover) e o
#   cancel-in-progress mata a anterior → sessão do Telegram renovada sem
#   depender do agendador do GitHub, que atrasa horas os cron jobs
# - Repositório público = minutos de Actions ilimitados (grátis para sempre)

on:
  push:
    branches: [main]
    paths: ["bot.py", "iptv.py", "rebel.m3u", ".github/workflows/neobot.yml"]
  workflow_dispatch:
  schedule:
    # Rede de segurança: se a cadeia de handover se partir (ex.: falha na
    # instalação de dependências), este cron volta a levantar o bot.
    # NÃO é o mecanismo principal — o agendador do GitHub atrasa horas.
    - cron: "25 */6 * * *"

# Necessário para o handover: disparar a execução seguinte com o GITHUB_TOKEN
# (workflow_dispatch é a exceção documentada). contents: read é para o checkout.
permissions:
  contents: read
  actions: write

concurrency:
  group: neobot
  cancel-in-progress: true   # máx. 1 instância — nunca dois bots no mesmo token

jobs:
  neobot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg aria2 unzip
          curl -fsSL --retry 3 -o /tmp/deno.zip https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip
          sudo unzip -o /tmp/deno.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/deno
          deno --version || true
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # --- OpenCode CLI (para /opencode) ---
          npm install -g opencode-ai >/dev/null 2>&1 || \
            curl -fsSL https://opencode.ai/install | bash >/dev/null 2>&1 || true
          opencode --version || echo "OPENCODE_INDISPONIVEL"
          mkdir -p ~/.config/opencode
          # Modelo free do Zen. O catálogo muda: se um ID desaparecer, o bot
          # valida com `opencode models opencode` e cai para outro free.
          printf '{\n  "$schema": "https://opencode.ai/config.json",\n  "model": "opencode/glm-5.3-flash-free"\n}\n' > ~/.config/opencode/opencode.jsonc
          cat ~/.config/opencode/opencode.jsonc
          opencode models opencode || echo "MODELOS_INDISPONIVEIS_NESTE_MOMENTO"

      - name: Teste do motor Seal (diagnostico)
        continue-on-error: true
        run: |
          yt-dlp --version
          yt-dlp --no-playlist -f "bestaudio/best" --simulate --print "%(title)s" "https://www.youtube.com/watch?v=jNQXAC9IVRw" || echo "TESTE_YOUTUBE_FALHOU"

      - name: A arrancar o NEOBOT 🤖
        env:
          GH_TOKEN: ${{ github.token }}
          NEOBOT_TOKEN: ${{ secrets.NEOBOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # quota ZeroGPU do /music (ACE-Step)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # Lyria (/music) + Veo (/video)
          NEOBOT_HF_TOKENS: ${{ secrets.NEOBOT_HF_TOKENS }}   # tokens HF extra (rotação de quota ZeroGPU)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # /opencode (modelo free do OpenCode)
        run: |
          # Handover: pede já a execução seguinte, 5h20 depois. O job é morto
          # ao fim de 6h e o cron do GitHub atrasa horas — sem isto há janelas
          # de 7h a 14h em que o bot simplesmente não está a correr.
          (
            sleep 19200
            gh workflow run neobot.yml --ref main || \
              curl -fsS -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/neobot.yml/dispatches" \
                -d '{"ref":"main"}'
          ) &
          python -X utf8 bot.py
